name: seal-consistency

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - "canon/**"
      - "wellknown/**"
      - "schemas/**"
      - "llms.txt"
      - "contracts/MGPGenesis.sol"
      - "script/CheckSeal.s.sol"
      - ".github/workflows/seal-consistency.yml"
  pull_request:
    paths:
      - "canon/**"
      - "wellknown/**"
      - "schemas/**"
      - "llms.txt"
      - "contracts/MGPGenesis.sol"
      - "script/CheckSeal.s.sol"
  workflow_dispatch:

jobs:
  check-seal:
    name: Five-source + on-chain seal consistency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: forge build
        run: forge build
      - name: Local 5-source seal check
        run: forge script script/CheckSeal.s.sol --sig "checkSealLocal()"
      - name: Tamper test (must FAIL)
        run: |
          set +e
          cp canon/canon.txt /tmp/canon.orig
          printf 'Zoluntary yield from autonomous agents, funding the next generation. No authority collects; no one may alter this rule. The parent attests the child; no one proves the weights. The pool pays only what it holds. Invariants govern, not admins. Every document carries the seal of this text.' > canon/canon.txt
          forge script script/CheckSeal.s.sol --sig "checkSealLocal()" > /tmp/tamper.log 2>&1
          tamper_rc=$?
          cp /tmp/canon.orig canon/canon.txt
          if [ $tamper_rc -ne 0 ]; then
            echo "PASS: tampered canon correctly rejected"
            exit 0
          else
            echo "FAIL: tampered canon was NOT rejected -- SEAL BROKEN"
            echo "::error::SEAL BROKEN -- tampered canon.txt was not detected"
            exit 1
          fi
      - name: On-chain seal check (Base Sepolia)
        if: ${{ env.SEPOLIA_RPC_URL != '' }}
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          MGP_GENESIS_ADDRESS: ${{ secrets.MGP_GENESIS_ADDRESS }}
        run: |
          LOCAL_SEAL=$(cast keccak $(cat canon/canon.txt))
          ONCHAIN_SEAL=$(cast call $MGP_GENESIS_ADDRESS "canonHash()(bytes32)" --rpc-url $SEPOLIA_RPC_URL)
          echo "Local seal:   $LOCAL_SEAL"
          echo "On-chain seal: $ONCHAIN_SEAL"
          if [ "$LOCAL_SEAL" != "$ONCHAIN_SEAL" ]; then
            echo "::error::SEAL BROKEN -- on-chain seal does not match local canon"
            echo "## SEAL BROKEN" >> $GITHUB_STEP_SUMMARY
            echo "On-chain seal ($ONCHAIN_SEAL) != local seal ($LOCAL_SEAL)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          VERIFY=$(cast call $MGP_GENESIS_ADDRESS "verifySeal(bytes32)(bool)" $LOCAL_SEAL --rpc-url $SEPOLIA_RPC_URL)
          echo "verifySeal result: $VERIFY"
          if [ "$VERIFY" != "true" ]; then
            echo "::error::SEAL BROKEN -- verifySeal returned false"
            exit 1
          fi
          echo "On-chain seal check: PASSED"
      - name: Summary on failure
        if: failure()
        run: |
          echo "## SEAL BROKEN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more of the five seal sources disagrees with keccak256(canon/canon.txt), or the on-chain seal does not match." >> $GITHUB_STEP_SUMMARY
