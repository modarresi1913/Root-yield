[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
fuzz = { runs = 10000 }
invariant = { runs = 256, fail_on_revert = false }
gas_reports = ["*"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read", path = "./canon/" },
    { access = "read", path = "./wellknown/" },
    { access = "read", path = "./schemas/" },
    { access = "read", path = "./llms.txt" },
    { access = "read-write", path = "./deployed-addresses.json" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
exclude_lints = [
    "block-timestamp",
    "missing-zero-check",
    "unsafe-typecast",
    "weak-prng",
    "calls-loop",
    "reentrancy-events",
    "reentrancy-no-eth",
    "arbitrary-send-erc20",
]
lint_on_build = true
