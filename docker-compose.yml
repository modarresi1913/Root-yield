# docker-compose.yml -- MGP local demo environment.
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--block-time", "1"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 30

  deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    working_dir: /mgp
    volumes:
      - .:/mgp
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      - MGP_RPC_URL=http://anvil:8545
      - MGP_CHAIN_ID=31337
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        forge script script/Deploy.s.sol --rpc-url http://anvil:8545 --broadcast --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
        GENESIS=$$(jq -r '.receipts[-1].contractAddress' broadcast/Deploy.s.sol/31337/run-latest.json)
        USDC=$$(jq -r '.receipts[0].contractAddress' broadcast/Deploy.s.sol/31337/run-latest.json)
        echo "GENESIS=$$GENESIS" > /mgp/.deployed-addresses.env
        echo "USDC=$$USDC" >> /mgp/.deployed-addresses.env
        cat /mgp/.deployed-addresses.env

  demo:
    image: node:22-bookworm
    working_dir: /mgp/ts
    volumes:
      - .:/mgp
    depends_on:
      deploy:
        condition: service_completed_successfully
    environment:
      - MGP_RPC_URL=http://anvil:8545
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        source /mgp/.deployed-addresses.env
        export MGP_GENESIS_ADDRESS=$$GENESIS
        export MGP_USDC_ADDRESS=$$USDC
        cd /mgp/ts
        npm install --silent --no-audit --no-fund
        node --experimental-strip-types bin/mgp.js demo
